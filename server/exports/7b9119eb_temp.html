<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>测试PDF</title>
    <style>
        body {
            font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
            line-height: 1.8;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        h1 {
            text-align: center;
            color: #1a1a2e;
            border-bottom: 2px solid #409EFF;
            padding-bottom: 16px;
            margin-bottom: 8px;
        }
        h2 {
            color: #303133;
            border-left: 4px solid #409EFF;
            padding-left: 12px;
            margin-top: 32px;
        }
        h3 { color: #606266; margin-top: 20px; }
        .meta {
            text-align: center;
            color: #909399;
            margin-bottom: 24px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
        }
        th, td {
            border: 1px solid #DCDFE6;
            padding: 10px 12px;
            text-align: left;
        }
        th {
            background: #F5F7FA;
            font-weight: 600;
        }
        .summary-box {
            background: #F0F9FF;
            border: 1px solid #BAE7FF;
            border-radius: 8px;
            padding: 20px;
            margin: 16px 0;
        }
        .keywords {
            color: #409EFF;
            font-size: 14px;
            margin-top: 12px;
        }
        .transcript-segment {
            margin: 12px 0;
            padding: 12px;
            background: #FAFAFA;
            border-radius: 6px;
        }
        .speaker-label {
            font-weight: 600;
            color: #409EFF;
        }
        .time-label {
            color: #909399;
            font-size: 12px;
        }
        .footer {
            text-align: center;
            color: #C0C4CC;
            font-size: 12px;
            margin-top: 40px;
            padding-top: 16px;
            border-top: 1px solid #EBEEF5;
        }
        @page {
            size: A4;
            margin: 2cm;
        }
    </style>
</head>
<body>
    <h1>测试PDF</h1>
    <p class="meta">
        会议时间: 2026-07-31 12:00 | 时长: 1分40秒
    </p>

    <h2>📋 会议摘要</h2>
    <div class="summary-box">
        <p>这是测试摘要。</p>
        
        <p class="keywords"><strong>关键词:</strong> 测试,PDF</p>
        
    </div>

    <h2>🎯 待办事项</h2>
    <table>
        <tr><th>序号</th><th>任务内容</th><th>负责人</th><th>截止时间</th><th>状态</th></tr>
        
    </table>

    

    <h2>📝 完整转写文本</h2>
    
    <div class="transcript-segment">
        <span class="speaker-label">[speaker1]</span>
        <span class="time-label">(0.0s - 5.0s)</span>
        <p>你好世界</p>
    </div>
    

    <div class="footer">
        <p>本纪要由 基于LangChain的智能会议纪要助手系统 自动生成</p>
    </div>
</body>
</html>
